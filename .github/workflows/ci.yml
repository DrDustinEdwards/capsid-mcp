name: CI

# capsid had no .github/workflows at all until 2026-08-11. That is batch-two
# item 1, and it matters more here than in a leaf project: capsid is the
# dependency of every other repo in the portfolio.
#
# Be honest about what this buys. Offline checks would NOT have caught the
# outage that motivated the whole audit: a "form-action 'self'" CSP landed in
# 423bbd6, type-checked perfectly, passed every unit test, and broke the OAuth
# consent flow for 26 days. tsc and node --test never touch a live surface.
# Only scripts/verify-live.mjs catches that class, and it already existed.
# Nothing invoked it, so it was not yet a gate. What this workflow adds is that
# the live gate runs at all, on every push and every six hours.
#
# THE TESTED ARTIFACT IS NOT THE SHIPPED ARTIFACT. Accepted, and recorded rather
# than glossed. checks and deploy run on separate runners and each does its own
# npm ci, so what ships is a REBUILD of the tested commit, not the bytes that
# passed. This is the same gap foxhound's ci.yml records; closing it means
# uploading the build from checks and downloading it in deploy.
#
# It is materially better than session 2, where the deploy happened on Dustin's
# machine from a working tree CI never saw. Two mitigations now stand: the runner
# checks out clean, so BUILD_DIRTY=false actually means something here, and the
# live job asserts /health reports this exact commit before the run goes green.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Every six hours. The outage ran 26 days; a six hour ceiling on
  # time-to-detect is the point of the schedule, not the offline checks.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Absent, the token's scopes come from the
# repository default, which for this account is read and WRITE on contents. No job
# here pushes, comments, or touches the API at all: checks runs tsc and node --test,
# deploy talks to Cloudflare with its own secrets, and the live gate talks to a URL.
# Declaring it here means the token cannot be used for more than the checkout even
# if a step, or something a step installs, tries.
permissions:
  contents: read

# THIRD PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag. A tag is a moving
# pointer that the tag's owner can repoint at any time, and these actions run with
# the checkout of this repository and the environment of the deploy job next to
# them. `@v5` means "whatever v5 means the next time this workflow runs"; a sha
# means one immutable tree. Dependabot understands the `# v5.x.x` comment form and
# will still offer bumps.
#
# The shas below are what actions/checkout@v5 and actions/setup-node@v5 resolved to
# on 2026-08-13, read with `gh api repos/<action>/git/ref/tags/v5`. Both actions now
# have a v7; this change pins the version already in use and deliberately does not
# ride a major bump in on the back of a security fix.
#
# Nothing here sets continue-on-error, and nothing should. A step that fails fails
# its job, and the live job does not run unless checks passed.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Verified on a fresh clone 2026-08-11 before this workflow was written:
      # npm ci, npm run check and npm test all succeed with no wrangler.jsonc
      # present, because tsconfig pulls its types from @cloudflare/workers-types
      # in node_modules rather than from generated bindings. That is why the
      # checks job needs no config and no secrets.
      - name: Install dependencies
        run: npm ci

      # tsc --noEmit is the safe form here: a conventional single-project config
      # with an explicit include of ["src"]. See capsid/conventions.md on why
      # `tsc -b` is required elsewhere in the portfolio.
      #
      # This step covers src only. The test suite has its own step below; the gap
      # this comment used to record as unfixed was closed on 2026-08-17.
      - name: Typecheck
        run: npm run check

      # The test suite is type-checked too, under its own config (quality audit
      # 10.2). tsconfig.json includes only src, so until 2026-08-17 the files that
      # guard every other invariant were never seen by tsc: node's type stripping
      # erases types without checking them, so a test could stop compiling and
      # still report green. Two configs rather than one widened include, because
      # only this one carries node types and the shipping config must keep
      # rejecting a node API in src/.
      - name: Typecheck tests
        run: npm run check:test

      - name: Tests
        run: npm test

  # Ordered after checks, exactly the foxhound shape that has proved itself
  # twice: a failing typecheck or test never reaches production. No
  # continue-on-error, and deliberately no `if: secrets.X != ''` guard. A job
  # that skips when its credentials are missing makes "deployed" and "could not
  # deploy" indistinguishable, which is the fail-open shape
  # capsid/conventions.md rules against. If the secrets are absent this job
  # fails loudly, which is the correct signal.
  deploy:
    name: deploy
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc is gitignored, so a runner has no deployable config.
      # scripts/ci-config.mjs rebuilds it: every binding is resolved by NAME
      # against the account, then checked against an id pinned in the script,
      # and any disagreement is a hard failure. Resolving by name alone is the
      # trap that would silently rebind this Worker to the wrong database.
      - name: Reconstruct wrangler.jsonc
        run: node scripts/ci-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # scripts/deploy.mjs stamps BUILD_SHA, BUILD_DIRTY and BUILT_AT as
      # deploy-time vars. On a runner the tree is a clean checkout, so
      # dirty=false is meaningful here in a way it is not on a laptop.
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  live:
    name: live gate
    needs: [checks, deploy]
    # Never on pull_request. A PR head sha is not deployed and never will be, so
    # asserting anything about production from one is meaningless.
    #
    # !failure() && !cancelled() rather than always(): on a schedule run the
    # deploy job is SKIPPED, and a plain `needs: deploy` would skip this job too,
    # silently retiring the six-hourly check that exists to cap time-to-detect.
    # This form runs when a dependency was skipped but not when one failed.
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # No npm ci on purpose: scripts/verify-live.mjs imports nothing outside the
      # Node standard library and runs on global fetch, so it needs no node_modules.
      # Keeping it dependency-free is what lets the live gate run even if install is
      # broken.

      # THE SHA-EQUALITY GATE. EXPECT_SHA is set only when the deploy job in
      # THIS run actually succeeded, so gate 1 polls /health until it reports
      # this exact commit. That closes the last gap in "the deployed worker is
      # this commit": provenance made it readable (ac88c99), and this makes it
      # asserted on every push.
      #
      # On a schedule run the deploy job is skipped, needs.deploy.result is
      # 'skipped', and EXPECT_SHA resolves to the empty string, which the script
      # treats as falsy. The six-hourly run then asserts the live surface without
      # claiming anything about which commit is on it, which is correct: nothing
      # was deployed.
      #
      # The poll budget is raised well above the 10 x 3s default because this is
      # waiting on a rollout that started seconds ago. 40 x 3s gives two minutes.
      - name: verify:live
        env:
          EXPECT_SHA: ${{ needs.deploy.result == 'success' && github.sha || '' }}
          VERIFY_POLL_ATTEMPTS: "40"
          # Gate 2 writes the client id it registered here, and the reap step below
          # deletes exactly that key. The file is the whole channel between them.
          PROBE_CLIENT_FILE: ${{ runner.temp }}/probe-client-id
          # Gate 2b READS one long-lived canary record straight out of OAUTH_KV.
          # It reads KV rather than asking the Worker because a missing client and
          # a KV outage are the same error page through /authorize, and the whole
          # value of the canary is telling those two apart. Without these the gate
          # SKIPS and says so; it never passes quietly.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:live

      # Gate 2 registers a fresh client every run, and it must: reusing one would
      # take the approved-client fast path that hid the 26-day outage, and the run
      # would prove nothing. So the registration is cleaned up here instead, AFTER
      # the gate has finished with its client.
      #
      # It deletes ONE key: the id gate 2 recorded in PROBE_CLIENT_FILE. It does not
      # list the namespace and does not match on client names, which is what it used
      # to do (see the header of the script for why that was wrong).
      #
      # Runs even when verify:live failed (always()), because a failed gate still
      # registered a client and leaving it behind would make the leak worse on
      # exactly the runs that get retried. It does not mask a failure: this step
      # cannot turn the job green, and its own failure still fails the job.
      #
      # No npm ci needed here either; the script uses global fetch against the KV
      # REST API precisely so this job stays install-free.
      - name: Reap this run's probe client registration
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_CLIENT_FILE: ${{ runner.temp }}/probe-client-id
        run: node scripts/reap-probe-clients.mjs

