name: CI

# THE TESTED ARTIFACT IS NOT THE SHIPPED ARTIFACT. checks and deploy run on separate
# runners and each does its own npm ci, so what ships is a REBUILD of the tested
# commit, not the bytes that passed. Closing this means uploading the build from checks
# and downloading it in deploy. foxhound's ci.yml records the same gap.
#
# Two mitigations stand: the runner checks out clean, so BUILD_DIRTY=false means
# something, and the live job asserts /health reports this exact commit before the run
# goes green.
#
# Offline checks do not catch the class of outage that motivated the audit: a
# "form-action 'self'" CSP landed in 423bbd6, type-checked, passed every unit test, and
# broke the OAuth consent flow for 26 days. Only scripts/verify-live.mjs catches that,
# and it already existed with nothing invoking it.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Every six hours. The outage ran 26 days; a six hour ceiling on time-to-detect is
  # the point of the schedule, not the offline checks.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Absent, the token's scopes come from the repository
# default, which for this account is read and WRITE on contents. No job here pushes,
# comments, or touches the API: checks runs tsc and node --test, deploy talks to
# Cloudflare with its own secrets, and the live gate talks to a URL.
permissions:
  contents: read

# Rapid pushes supersede each other: a newer run on the same ref cancels the older one,
# so two push deploys cannot interleave. Keyed on the event name too, because the
# six-hourly schedule run shares refs/heads/master with push runs and must never cancel
# a deploy mid-flight, nor be cancelled by one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# THIRD PARTY ACTIONS ARE PINNED BY COMMIT SHA, not by tag. A tag is a moving pointer
# its owner can repoint, and these actions run with this repository's checkout and the
# deploy job's environment beside them. Dependabot understands the `# v5.x.x` comment
# form and still offers bumps.
#
# The shas below are what actions/checkout@v5 and actions/setup-node@v5 resolved to on
# 2026-08-13, read with `gh api repos/<action>/git/ref/tags/v5`. Both actions now have a
# v7; this pins the version already in use rather than riding a major bump in on the
# back of a security fix.
#
# Nothing here sets continue-on-error, and nothing should.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # TIMEOUTS ON EVERY JOB (residual 6). Without one a job inherits GitHub's 360-minute
    # default, so a hung test or a wedged wrangler call burns six hours of the Actions
    # budget the improve loop's kill switch is metered against, and holds the
    # concurrency group against every later push. Each number is roughly four times the
    # job's observed run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Verified on a fresh clone 2026-08-11: npm ci, npm run check and npm test all
      # succeed with no wrangler.jsonc present, because tsconfig pulls its types from
      # @cloudflare/workers-types rather than from generated bindings. That is why this
      # job needs no config and no secrets.
      - name: Install dependencies
        run: npm ci

      # tsc --noEmit is the safe form here: a conventional single-project config with an
      # explicit include of ["src"]. See capsid/conventions.md on why `tsc -b` is
      # required elsewhere in the portfolio. This step covers src only.
      - name: Typecheck
        run: npm run check

      # The test suite is type-checked under its own config (quality audit 10.2).
      # tsconfig.json includes only src, so until 2026-08-17 the files guarding every
      # other invariant were never seen by tsc: node's type stripping erases types
      # without checking them, so a test could stop compiling and still report green.
      # Two configs rather than one widened include, because only this one carries node
      # types and the shipping config must keep rejecting a node API in src/.
      - name: Typecheck tests
        run: npm run check:test

      # The integration suite has its own config: it needs the workers-types experimental
      # surface and the pool's `cloudflare:test` ambient module, and the shipping config
      # must keep rejecting both in src/.
      - name: Typecheck integration tests
        run: npm run check:integration

      # scripts/improve-report.mjs is copied BYTE-IDENTICAL into four other repos, which
      # do not all gate it the same way. On 2026-09-07 this repo shipped ten type errors
      # in it that only dustinedwards-info's stricter gate could see. This is the guard,
      # in the repo the file is authored in.
      - name: Typecheck the copied scorer script
        run: npm run check:scripts

      - name: Tests
        run: npm test

      # THE INTEGRATION LAYER (audit 2026-09-07). The whole Worker inside workerd, with a
      # real D1 the migrations are applied to, real KV and real R2. A SEPARATE step
      # rather than part of `npm test` because the two suites fail differently: a unit
      # failure is a handler issuing the wrong statement, an integration failure is
      # SQLite, the OAuth provider or the runtime refusing it.
      - name: Integration tests
        run: npm run test:integration

  # Ordered after checks: a failing typecheck or test never reaches production. No
  # continue-on-error, and deliberately no `if: secrets.X != ''` guard. A job that skips
  # when its credentials are missing makes "deployed" and "could not deploy"
  # indistinguishable, which is the fail-open shape capsid/conventions.md rules against.
  # If the secrets are absent this job fails loudly.
  deploy:
    name: deploy
    needs: checks
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc is gitignored, so a runner has no deployable config.
      # scripts/ci-config.mjs rebuilds it: every binding is resolved by NAME against the
      # account, then checked against an id pinned in the script, and any disagreement is
      # a hard failure. Resolving by name alone would silently rebind this Worker to the
      # wrong database.
      - name: Reconstruct wrangler.jsonc
        run: node scripts/ci-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Refuse to ship code against a database missing a migration. Migrations are
      # applied by hand (README), so a commit that adds migrations/000N and pushes would
      # otherwise deploy a Worker whose SQL assumes a table the live D1 lacks. wrangler
      # prints "No migrations to apply!" when the remote is current and exits 0 either
      # way, so the confirmation string is the signal. Fails closed: an unreadable or
      # unexpected output is a missing confirmation and stops the deploy.
      - name: Assert all migrations are applied
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 migrations list capsid --remote 2>&1)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "No migrations to apply"; then
            echo "::error::the live database is missing migrations; apply them with 'wrangler d1 migrations apply capsid --remote' before this deploy" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  live:
    name: live gate
    needs: [checks, deploy]
    # Above the poll budget (40 x 3s per polling gate) with room for every gate.
    timeout-minutes: 15
    # Never on pull_request. A PR head sha is not deployed, so asserting anything about
    # production from one is meaningless.
    #
    # !failure() && !cancelled() rather than always(): on a schedule run the deploy job
    # is SKIPPED, and a plain `needs: deploy` would skip this job too, retiring the
    # six-hourly check. This form runs when a dependency was skipped but not when one
    # failed.
    if: github.event_name != 'pull_request' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # No npm ci on purpose: scripts/verify-live.mjs imports nothing outside the Node
      # standard library and runs on global fetch. Keeping it dependency-free is what
      # lets the live gate run even if install is broken.

      # EXPECT_SHA is this run's commit when deploy succeeded, and master head on a
      # schedule run. Empty otherwise: the ternary below is the behaviour.
      - name: verify:live
        env:
          EXPECT_SHA: ${{ (needs.deploy.result == 'success' || github.event_name == 'schedule') && github.sha || '' }}
          VERIFY_POLL_ATTEMPTS: "40"
          PROBE_CLIENT_FILE: ${{ runner.temp }}/probe-client-id
          # GATE 1c ASSERTS BACKUP FRESHNESS ON THE SCHEDULED RUN ONLY (residual 7).
          # /health has reported backup.last_ok since 2026-09-07 and nothing read it. A
          # push runs minutes after a deploy and says nothing about last night's backup;
          # the six-hourly schedule bounds this at six hours. Off, the gate reports
          # SKIPPED and says what it did not assert.
          ASSERT_BACKUP_FRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Gate 2b READS one long-lived canary record straight out of OAUTH_KV. It reads
          # KV rather than asking the Worker because a missing client and a KV outage are
          # the same error page through /authorize. Without these the gate SKIPS and says
          # so; it never passes quietly.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:live

      # Only if this run's deploy succeeded, then the gate failed. A scheduled
      # run skipping deploy must not roll back a live sha that is merely behind.
      - name: Roll back the deploy this run shipped
        if: failure() && needs.deploy.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HEALTH_URL=https://capsid.dustin-edwards.workers.dev/health
          ROLLBACK_FROM=$(curl -fsS "$HEALTH_URL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).sha??"unknown")}catch{process.stdout.write("unreadable")}})')
          echo "::warning::the live gate failed against ${ROLLBACK_FROM}; rolling back to the previous version"
          npx --yes wrangler@4.107.0 rollback --name capsid --message "live gate failed for ${GITHUB_SHA}" --yes
          # The rollout is not instant, so read the sha back rather than assuming.
          for i in $(seq 1 20); do
            ROLLBACK_TO=$(curl -fsS "$HEALTH_URL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).sha??"unknown")}catch{process.stdout.write("unreadable")}})')
            if [ "${ROLLBACK_TO}" != "${ROLLBACK_FROM}" ]; then break; fi
            sleep 3
          done
          echo "::error::rolled back: was ${ROLLBACK_FROM} (this run's commit ${GITHUB_SHA}), now ${ROLLBACK_TO}. master still points at the bad commit; land a fix or revert it."
          echo "rollback_from=${ROLLBACK_FROM} rollback_to=${ROLLBACK_TO}" >> "$GITHUB_STEP_SUMMARY"

      # Gate 2 registers a fresh client every run, and it must: reusing one would take
      # the approved-client fast path that hid the 26-day outage. The registration is
      # cleaned up here instead, AFTER the gate has finished with its client.
      #
      # It deletes ONE key: the id gate 2 recorded in PROBE_CLIENT_FILE. It does not list
      # the namespace and does not match on client names; see the script's header.
      #
      # Runs even when verify:live failed (always()), because a failed gate still
      # registered a client. It cannot turn the job green, and its own failure still
      # fails the job.
      #
      # No npm ci needed here either; the script uses global fetch against the KV REST
      # API so this job stays install-free.
      - name: Reap this run's probe client registration
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_CLIENT_FILE: ${{ runner.temp }}/probe-client-id
        run: node scripts/reap-probe-clients.mjs

