name: improve-score

# THE SCORER. TWO JOBS, AND JOB B NEVER PUTS ATTEMPT CODE ON THE RUNNER.
#
#   build  (PER REPO, no secrets) checks out the ATTEMPT branch and runs this
#          repo's own build / test / lint / measure commands, writes a normalized
#          metrics.json { build_passes, test_pass_rate|null, lint_count|null,
#          bundle_size_bytes|null }, and uploads it with the attempt source under
#          code/. It never sees a credential and persist-credentials is false.
#          It also exports build_passes as a JOB OUTPUT taken from the build
#          step's own outcome, because the artifact is attacker-writable.
#   score  (BYTE-IDENTICAL across all five roster repos) checks out the DEFAULT
#          branch ONLY, never overlays the attempt onto the runner, and runs the
#          holdout inside a network-less read-only container with the attempt
#          mounted read-only. It reads results from the container's stdout pipe.
#
# ONLY THE build JOB DIFFERS PER REPO. The score job and scripts/improve-report.mjs
# are copied verbatim; change them here and re-copy, never edit one copy.
#
# WHY THE CONTAINER (audit 2026-09-07, Opus CRITICAL 5.1 and Grok CRITICAL 1+2). The
# previous split ran `cp -r attempt/code/. .` over the default-branch checkout and then
# executed holdout tests that import the attempt source, in the same job that holds
# IMPROVE_SCORE_KEY. Three consequences, all live:
#
#   1. Job A's staging did not wipe code/ first, so attempt code running during Job A's
#      own test step could write code/scripts/improve-report.mjs. The overlay then
#      replaced the TRUSTED signing script and the Post step ran it with the HMAC key
#      in its environment.
#   2. The same overlay could plant extra .improve-holdout/*.test.* files, which the
#      sync did not delete and the counting glob counted.
#   3. The TAP destination was a seekable file in the attempt's own filesystem, so
#      attempt code could rewrite it from process.on('exit') after the reporter
#      flushed.
#
# Attempt code now executes ONLY inside `docker run --rm --network none --read-only`,
# with the workspace nowhere in it, results leaving only as a stdout pipe the container
# cannot seek back into, and the trusted scorer script copied out of the workspace
# before any untrusted byte exists on disk.
#
# WHAT REMAINS ATTEMPT-INFLUENCED, as of 2026-09-07: bundle_size_bytes ALONE.
# test_pass_rate and lint_count are recomputed in the score job's container from this
# repo's own commands, taken from the map in scripts/improve-report.mjs on the default
# branch; metrics.json is read for bundle_size_bytes and cross-checked on the other
# two, with a mismatch logged and the container's value winning. bundle_size_bytes
# stays with Job A because measuring it means running the repo's bundler, which an
# offline container cannot do. The two numbers deciding keep-or-revert against a floor
# are build_passes (a job output from a step outcome) and holdout_pass_rate (recomputed
# by the Worker from the container's own output against the R2 manifest).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The attempt branch to score.
        required: true
      run_id:
        description: The improve run this attempt belongs to.
        required: true
      attempt_id:
        description: The attempt being scored. The literal suffix -baseline measures the base.
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (per-repo, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      # THE ANCHOR COMES FROM A STEP OUTCOME, NOT FROM THE ARTIFACT (audit 2026-09-07,
      # Grok MAJOR 3). metrics.json is written on a runner that has already executed
      # attempt code, so a detached writer can rewrite it before the upload. A job
      # output is set by the Actions runner from the step's own result.
      build_passes: ${{ steps.build.outcome == 'success' && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Capture the attempt head sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # AFTER checkout: actions/checkout cleans the workspace, so a file written before
      # it is deleted and never reaches the artifact.
      - name: Stamp the start
        id: started
        run: echo "epoch=$(date -u +%s)" > started.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        continue-on-error: true
        run: npm run check

      # node directly, not `npm test --`: the reporter flags must come BEFORE the test
      # glob or node ignores them, and npm appends them after the script's fixed glob.
      # PER-REPO command; mirrors package.json's test invocation.
      - name: Test
        id: test
        continue-on-error: true
        run: node --import ./test/resolve-ts.mjs --test-reporter=tap --test-reporter-destination=test-report.json --test "test/*.test.ts"

      - name: Measure
        id: measure
        continue-on-error: true
        run: |
          set -uo pipefail
          BUILD_PASSES=0; [ "${{ steps.build.outcome }}" = "success" ] && BUILD_PASSES=1
          RATE=$(node scripts/improve-report.mjs --rate test-report.json || echo "")
          LINT_COUNT=$(npm run check:test 2>&1 | grep -c "error TS" || true)
          # bundle_size_bytes needs a wrangler.jsonc and this repo gitignores the real
          # one, so the dry run had nothing to read and the metric came back null on
          # every run. Generated here from wrangler.jsonc.example plus the pinned ids in
          # scripts/bindings.mjs, with NO NETWORK and NO SECRETS: a dry run bundles, it
          # does not talk to the account. Job A holds no credential and this does not
          # change that (ruled 2026-09-08).
          node scripts/dry-run-config.mjs
          BUNDLE_BYTES=$(npx wrangler deploy --dry-run --outdir=.improve-build > /dev/null 2>&1 && du -sb .improve-build/index.js 2>/dev/null | cut -f1 || echo "")
          BUILD_PASSES="${BUILD_PASSES}" RATE="${RATE}" LINT_COUNT="${LINT_COUNT}" BUNDLE_BYTES="${BUNDLE_BYTES}" node -e '
            const n=(v)=>(v===undefined||v===""?null:Number(v));
            process.stdout.write(JSON.stringify({
              build_passes: Number(process.env.BUILD_PASSES||"0"),
              test_pass_rate: n(process.env.RATE),
              lint_count: n(process.env.LINT_COUNT),
              bundle_size_bytes: n(process.env.BUNDLE_BYTES),
            }));
          ' > metrics.json

      # PER-REPO: the source trees the holdout imports. capsid-mcp: src.
      #
      # `rm -rf code` FIRST (audit 2026-09-07, Grok CRITICAL 1). Without it a code/
      # directory written by attempt code during the Test step survives into the
      # artifact alongside the trees this step stages, and the old Job B copied the whole
      # of code/ over its own checkout.
      - name: Stage the scored source
        run: |
          set -euo pipefail
          rm -rf code
          mkdir -p code
          cp -r src code/

      - name: Upload the attempt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attempt
          retention-days: 1
          path: |
            metrics.json
            started.txt
            code

  # ============================================================================
  # BYTE-IDENTICAL BELOW THIS LINE ACROSS ALL FIVE ROSTER REPOS. Do not edit one
  # copy; edit capsid-mcp's and re-copy. test/workflow-identity.test.ts pins it.
  # ============================================================================
  score:
    name: score (holds secrets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # THE DEFAULT BRANCH ONLY. Nothing from the attempt branch is checked out here and
      # nothing is overlaid onto this working tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Off because it would auto-run the package manager to locate a cache dir
          # before corepack has provisioned pnpm for a pnpm-workspace repo.
          package-manager-cache: false

      # PACKAGE-MANAGER AGNOSTIC so this job stays byte-identical across an npm repo and
      # a pnpm workspace: pnpm-lock.yaml picks pnpm via corepack, honouring the repo's
      # packageManager field, otherwise npm ci. Both read the DEFAULT branch's lockfile,
      # which an attempt cannot edit because it is a protected path.
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # THE TRUSTED SCRIPT AND THE NODE BINARY ARE RESOLVED BEFORE ANY UNTRUSTED BYTE
      # EXISTS ON THIS RUNNER, and only these copies are used afterwards. Nothing
      # untrusted is written to the workspace any more; this makes that property
      # independent of the steps below staying correct.
      #
      # It also writes the per-repo sandbox commands and the staged-tree list from the map
      # inside that trusted script, which is how this job stays byte-identical while
      # measuring five different repos, and mints the marker nonce the container shell
      # uses to frame its output.
      - name: Stash the trusted scorer, the sandbox commands and the marker nonce
        id: trusted
        env:
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted"
          cp scripts/improve-report.mjs "${RUNNER_TEMP}/trusted/improve-report.mjs"
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
          NODE_BIN=$(command -v node)
          "${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" --secondary-scripts "${IMPROVE_NAMESPACE}" "${RUNNER_TEMP}/trusted"
          echo "nonce=$("${NODE_BIN}" -e 'process.stdout.write(require("crypto").randomUUID().replace(/-/g,""))')" >> "$GITHUB_OUTPUT"

      # Into RUNNER_TEMP, never the workspace, so the attempt tree and the default-branch
      # checkout never share a directory.
      - name: Download the attempt artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attempt
          path: ${{ runner.temp }}/attempt

      # NO LONG-LIVED R2 SECRET. The holdout is pulled with a ONE-HOUR object-read-only
      # credential scoped to this namespace's prefix, minted by the Worker on request and
      # signed with the same per-namespace key as the score report. This step's env holds
      # only the signing key. Checksums are when_required because R2 rejects the CRC
      # headers newer aws CLIs send by default.
      #
      # WIPED BEFORE THE SYNC (audit 2026-09-07, Grok CRITICAL 1): `aws s3 sync` has no
      # --delete here, so a pre-existing file under the destination would survive and be
      # counted as a case.
      - name: Pull the holdout suite
        id: holdout
        continue-on-error: true
        env:
          IMPROVE_SCORE_KEY: ${{ secrets.IMPROVE_SCORE_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
          CAPSID_URL: https://capsid.dustin-edwards.workers.dev
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          NODE_OPTIONS: ""
          NODE_BIN: ${{ steps.trusted.outputs.node }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$("${NODE_BIN}" -e 'process.stdout.write(JSON.stringify({ namespace: process.env.IMPROVE_NAMESPACE, jti: require("crypto").randomUUID() }))')
          SIG=$(TS="${TS}" BODY="${BODY}" "${NODE_BIN}" -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.IMPROVE_SCORE_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          CRED_FILE=$(mktemp)
          STATUS=$(/usr/bin/curl --silent --show-error -o "${CRED_FILE}" -w '%{http_code}' \
            -X POST "${CAPSID_URL}/improve/holdout-credential" \
            -H "Content-Type: application/json" \
            -H "X-Improve-Namespace: ${IMPROVE_NAMESPACE}" \
            -H "X-Improve-Timestamp: ${TS}" \
            -H "X-Improve-Signature: ${SIG}" \
            --data "${BODY}")
          if [ "${STATUS}" != "200" ]; then
            echo "holdout credential request failed (HTTP ${STATUS}):" >&2
            cat "${CRED_FILE}" >&2
            exit 1
          fi
          # The credential values are exported for the aws CLI and never echoed.
          eval "$(CRED_FILE="${CRED_FILE}" "${NODE_BIN}" -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CRED_FILE, "utf8"));
            const fields = [["AWS_ACCESS_KEY_ID", c.access_key_id], ["AWS_SECRET_ACCESS_KEY", c.secret_access_key], ["AWS_SESSION_TOKEN", c.session_token], ["HOLDOUT_ENDPOINT", c.endpoint], ["HOLDOUT_BUCKET", c.bucket], ["HOLDOUT_PREFIX", c.prefix]];
            for (const [name, value] of fields) {
              if (!value) { console.error("missing " + name + " in the credential response"); process.exit(1); }
              process.stdout.write("export " + name + "=" + JSON.stringify(value) + "\n");
            }')"
          rm -rf "${RUNNER_TEMP}/holdout"
          mkdir -p "${RUNNER_TEMP}/holdout"
          aws s3 sync "s3://${HOLDOUT_BUCKET}/${HOLDOUT_PREFIX}" "${RUNNER_TEMP}/holdout/" --endpoint-url "${HOLDOUT_ENDPOINT}"

      # THE HOLDOUT IMPORT MANIFEST, checked before anything runs (ruled 2026-09-08).
      # improve/holdout/<ns>/imports.txt lists every name the hidden suite imports out of
      # this repo's source. It is committed and not secret: an export name is already in
      # the source.
      #
      # A gate rather than a note. The bloat pass removed two exports on a scan that
      # found no caller in src/ or test/; the holdout imported both, and the holdout is
      # structurally invisible to anything that runs in the repo. 28 of 30 against an
      # anchor of min 1.0. This fails in BOTH directions: the dead-export check treats a
      # listed name as a caller, and this step refuses a case importing a name that is
      # not listed.
      #
      # It runs on the TRUSTED copy, over the R2 sync, before the container. It never
      # prints a case filename.
      - name: Check the holdout import manifest
        env:
          NODE_BIN: ${{ steps.trusted.outputs.node }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
        run: |
          set -euo pipefail
          "${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" --check-holdout-imports \
            "${RUNNER_TEMP}/holdout" "${IMPROVE_NAMESPACE}" \
            "improve/holdout/${IMPROVE_NAMESPACE}/imports.txt"

      # THE ONLY PLACE ATTEMPT CODE EVER RUNS IN THIS JOB, and it runs with no network, a
      # read-only root, no workspace mount, and no secret in scope.
      #
      #   --network none    nothing it learns can leave, including the suite.
      #   --read-only       the image and every bind mount stay immutable.
      #   -v ...:ro         attempt, holdout and node_modules are read-only.
      #   --tmpfs /work     the only writable surface, and it dies with the run.
      #   pinned by digest  so the image cannot be repointed.
      #
      # GLIBC, NOT ALPINE. The container mounts node_modules installed by the RUNNER,
      # which is Ubuntu and therefore glibc. On an Alpine image every package with a
      # platform-specific native binary asks for its musl build and finds only the gnu
      # one: rollup threw at `/repo/node_modules/rollup/dist/native.js:121` on foxhound,
      # taking vitest and everything downstream of vite with it, and biome could not
      # resolve its binary at all. Pure-JS tooling (node --test, tsc) was fine, which is
      # why capsid-mcp measured clean while three repos reported null. bookworm matches
      # the runner.
      #
      # THE FULL IMAGE, NOT slim, BECAUSE IT CARRIES git. A foxhound test shells out to
      # git and slim answered "git: not found", failing one file of 255. Ruled
      # 2026-09-08: add the tool rather than exclude the file, because excluding a file
      # to make a number go up is how a score stops describing the suite. apt-get cannot
      # run behind --network none, so the tool has to be in the image or absent.
      #
      # RESULTS LEAVE AS A STDOUT PIPE. There is no seekable TAP destination for the
      # child to rewrite: the reporter writes to the container's stdout, the runner
      # captures it outside the container, and a test's own stdout is escaped by node's
      # TAP reporter into `# ` comment lines, so it cannot forge a result line at column
      # 0. The per-case markers below are emitted by this trusted shell, never by a test.
      #
      # THE SECONDARIES ARE RECOMPUTED HERE TOO (audit 2026-09-07 residual). Job A
      # measures test_pass_rate and lint_count on a runner that has already run attempt
      # code, and the CI plant in run 34162010375 put a forged test_pass_rate 1 and
      # lint_count 0 into a signed report. Both are now measured HERE, by the repo's own
      # commands, in the same sandbox, framed by a nonce the attempt never sees.
      # metrics.json survives for bundle_size_bytes alone, and is cross-checked.
      #
      # THE WORKING TREE IS THE DEFAULT BRANCH WITH THE DECLARED TREES REPLACED. /work
      # starts as a symlink view of the trusted checkout, so tests, configs and
      # node_modules are the copies an attempt cannot edit, and only the trees named in
      # the trusted map are taken from the attempt. Each is taken WHOLE, so a file the
      # attempt deleted is deleted in the sandbox instead of reappearing.
      - name: Run the holdout suite and recompute the secondaries in an isolated container
        id: holdout_run
        continue-on-error: true
        env:
          CAPSID_NONCE: ${{ steps.trusted.outputs.nonce }}
        run: |
          set -uo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /work:rw,exec,size=1024m \
            --tmpfs /tmp:rw,size=256m \
            -e CAPSID_NONCE \
            -v "${RUNNER_TEMP}/attempt/code:/attempt:ro" \
            -v "${RUNNER_TEMP}/holdout:/holdout:ro" \
            -v "${RUNNER_TEMP}/trusted:/trusted:ro" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /work \
            --entrypoint /bin/sh \
            node:24.14.1-bookworm@sha256:80fc934952c8f1b2b4d39907af7211f8a9fff1a4c2cf673fb49099292c251cec \
            -c '
              set -u
              # The nonce becomes a SHELL variable and leaves the environment, so no
              # process started below can read it and forge a marker.
              M="##CAPSID-${CAPSID_NONCE}"
              unset CAPSID_NONCE
              # THE TRUSTED TREE IS COPIED, NOT SYMLINKED. Symlinking /work/test at
              # /repo/test made the REAL path of a test file /repo/test/x.test.ts, so
              # node resolved its ../src import against /repo and the sandbox measured
              # the default branch against itself: run 34168480470 reported
              # test_pass_rate 1 for an attempt that broke two tests. Only node_modules
              # stays a symlink, where resolving through the real path is correct.
              #
              # NO APOSTROPHE ANYWHERE IN THIS SCRIPT, comments included. The whole thing
              # is one single-quoted shell argument, so one apostrophe ends it and the
              # rest runs on the RUNNER. Run 34168919050 died at
              # `cd: /repo: No such file or directory` for exactly that reason.
              # test/secondary-recompute.test.ts asserts it now.
              cd /repo || exit 1
              find . -path ./.git -prune -o -name node_modules -prune -o -type d -print | while read -r d; do
                mkdir -p "/work/$d"
              done
              find . -path ./.git -prune -o -name node_modules -prune -o -type f -print | while read -r f; do
                cp "$f" "/work/$f" 2>/dev/null || true
              done
              # -print -prune, not -print: without the prune this descends INTO
              # node_modules, finds every nested one, then tries to rm and relink them
              # underneath the read-only symlink it just made. On foxhound that was
              # thousands of "Read-only file system" lines.
              #
              # A REAL DIRECTORY OF SYMLINKS, not a symlink to the directory. vite writes
              # node_modules/.vite-temp before it loads a config, and a symlink to the
              # read-only mount made that ENOENT: foxhound and dustinedwards-info both
              # died trying to mkdir that path.
              #
              # One level of symlinks gives every package its read-only original while
              # leaving the directory writable in the tmpfs.
              find . -path ./.git -prune -o -name node_modules -print -prune | while read -r d; do
                rel=${d#./}
                rm -rf "/work/$rel"
                mkdir -p "/work/$rel"
                for e in "/repo/$rel"/* "/repo/$rel"/.[!.]*; do
                  [ -e "$e" ] || continue
                  ln -s "$e" "/work/$rel/${e##*/}"
                done
              done
              while read -r T; do
                [ -n "$T" ] || continue
                [ -d "/attempt/$T" ] || continue
                rm -rf "/work/$T"
                mkdir -p "/work/$(dirname "$T")"
                cp -R "/attempt/$T" "/work/$T"
              done < /trusted/trees.txt
              cd /work || exit 1
              # A REAL GIT REPOSITORY, because code that asks git a question should get
              # an answer rather than a fatal (ruled 2026-09-08). Adding the binary was
              # not enough: the sandbox assembles its tree by copying, deliberately
              # without .git, so the tool was present and the repository was not.
              #
              # ONE COMMIT OF THE ASSEMBLED TREE. No network, no remote, no history, no
              # real author: enough for rev-parse and status to answer, and nothing that
              # tells an attempt anything about the actual repository. node_modules and
              # the holdout are excluded so the index is the source tree, and every step
              # tolerates failure because a repo without git is not a reason to lose the
              # whole measurement.
              git init -q >/dev/null 2>&1 || true
              if [ -d /work/.git ]; then
                printf "node_modules\n.holdout\n" > /work/.git/info/exclude
                git config user.email sandbox@invalid >/dev/null 2>&1 || true
                git config user.name sandbox >/dev/null 2>&1 || true
                git add -A >/dev/null 2>&1 || true
                git commit -q -m sandbox --no-gpg-sign >/dev/null 2>&1 || true
              fi

              # THE SECONDARY PHASES RUN BEFORE THE HOLDOUT IS COPIED IN. The holdout
              # cases land in /work/.holdout, inside the working directory, so a lint
              # command spelled `eslint .` walks them: on foxhound 2026-09-08 the count
              # included the hidden suite and its filenames appeared in the run log.
              # Running each repo command first means the tree they see is the tree the
              # attempt produced.
              if [ -f /trusted/secondary-test.sh ]; then
                echo "${M}-TEST"
                sh /trusted/secondary-test.sh 2>&1
                echo "${M}-STATUS $?"
              fi
              if [ -f /trusted/secondary-lint.sh ]; then
                echo "${M}-LINT"
                sh /trusted/secondary-lint.sh 2>&1
                echo "${M}-STATUS $?"
              fi
              mkdir -p /work/.holdout
              cp /holdout/*.test.* /work/.holdout/ 2>/dev/null || true
              LOADER=""
              [ -f /work/test/resolve-ts.mjs ] && LOADER="--import ./test/resolve-ts.mjs"
              for f in /work/.holdout/*.test.*; do
                [ -e "$f" ] || continue
                echo "${M}-CASE ${f##*/}"
                # shellcheck disable=SC2086
                node --test --test-reporter=tap $LOADER "$f" 2>/dev/null || true
              done
              echo "${M}-END"
            ' > "${RUNNER_TEMP}/holdout.tap" 2>"${RUNNER_TEMP}/holdout.err" || true

      - name: Count the holdout result
        id: holdout_count
        continue-on-error: true
        env:
          NODE_BIN: ${{ steps.trusted.outputs.node }}
          CAPSID_NONCE: ${{ steps.trusted.outputs.nonce }}
        run: |
          set -uo pipefail
          TOTAL=$("${NODE_BIN}" -e 'try{process.stdout.write(String(require(process.env.RUNNER_TEMP + "/holdout/manifest.json").total))}catch{process.stdout.write("")}')
          PASSED=$("${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" --holdout-stream "${RUNNER_TEMP}/holdout.tap" "${CAPSID_NONCE}" || echo "0")
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"

      # The same trusted copy and the same stream. A mismatch on either recomputed metric
      # is printed and the sandbox value is the one that reaches the signed body.
      - name: Recompute the secondaries from the sandbox stream
        id: secondary
        continue-on-error: true
        env:
          NODE_BIN: ${{ steps.trusted.outputs.node }}
          CAPSID_NONCE: ${{ steps.trusted.outputs.nonce }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
        run: |
          set -uo pipefail
          "${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" --secondary \
            "${RUNNER_TEMP}/holdout.tap" "${IMPROVE_NAMESPACE}" "${CAPSID_NONCE}" \
            "${RUNNER_TEMP}/attempt/metrics.json" | tee -a "$GITHUB_OUTPUT"

      # RUN_ID, ATTEMPT_ID, BUILD_PASSES and the key are in THIS step's own env so a
      # poisoned GITHUB_ENV cannot override them; NODE_OPTIONS is cleared; the HMAC is
      # computed by node with the key read from the environment, never argv; node and curl
      # are absolute-pathed. ci_minutes is computed before the body.
      - name: Post the score report
        if: always()
        env:
          IMPROVE_SCORE_KEY: ${{ secrets.IMPROVE_SCORE_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
          CAPSID_URL: https://capsid.dustin-edwards.workers.dev
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ATTEMPT_HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          BUILD_PASSES: ${{ needs.build.outputs.build_passes }}
          HOLDOUT_TOTAL: ${{ steps.holdout_count.outputs.total }}
          HOLDOUT_PASSED: ${{ steps.holdout_count.outputs.passed }}
          SECONDARY_TEST_PASS_RATE: ${{ steps.secondary.outputs.test_pass_rate }}
          SECONDARY_LINT_COUNT: ${{ steps.secondary.outputs.lint_count }}
          NODE_OPTIONS: ""
          NODE_BIN: ${{ steps.trusted.outputs.node }}
        run: |
          set -euo pipefail
          if [ -z "${IMPROVE_SCORE_KEY}" ]; then
            echo "IMPROVE_SCORE_KEY is unset; the report cannot be signed and will not be sent." >&2
            exit 1
          fi
          STARTED_EPOCH=$(sed -n 's/^epoch=//p' "${RUNNER_TEMP}/attempt/started.txt" 2>/dev/null || echo "")
          export CI_MINUTES=$(S="${STARTED_EPOCH}" N="$(date -u +%s)" "${NODE_BIN}" -e 'const s=Number(process.env.S||"0"),n=Number(process.env.N||"0");process.stdout.write(s>0?((n-s)/60).toFixed(2):"0")')
          BODY=$("${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" "${RUNNER_TEMP}/attempt/metrics.json" "${HOLDOUT_TOTAL}" "${HOLDOUT_PASSED}")
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIG=$(TS="${TS}" BODY="${BODY}" "${NODE_BIN}" -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.IMPROVE_SCORE_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          # A shakedown dispatch (the literal RUN_ID "shakedown") has no run row in the
          # Worker, so its report is answered 409 "unknown run" by design, AFTER the
          # signature verified; a bad signature is 401 before the run lookup. That one
          # answer, on that one RUN_ID, is success. Any other non-2xx, and a 409 on a real
          # run id, still fails this step.
          RESPONSE_FILE=$(mktemp)
          STATUS=$(/usr/bin/curl --silent --show-error -o "${RESPONSE_FILE}" -w '%{http_code}' \
            -X POST "${CAPSID_URL}/improve/score" \
            -H "Content-Type: application/json" \
            -H "X-Improve-Namespace: ${IMPROVE_NAMESPACE}" \
            -H "X-Improve-Timestamp: ${TS}" \
            -H "X-Improve-Signature: ${SIG}" \
            --data "${BODY}")
          cat "${RESPONSE_FILE}"; echo
          case "${STATUS}" in 2*) exit 0 ;; esac
          if [ "${STATUS}" = "409" ] && [ "${RUN_ID}" = "shakedown" ] && grep -q "unknown run" "${RESPONSE_FILE}"; then
            echo "shakedown accepted: the Worker verified the signature and refused the nonexistent run, which is the expected terminal answer."
            exit 0
          fi
          echo "score report rejected (HTTP ${STATUS})" >&2
          exit 1
