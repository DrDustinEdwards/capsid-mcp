name: improve-score

# THE SCORER, SPLIT INTO TWO JOBS (audit 2026-09-06, option a).
#
#   build  (PER REPO, no secrets) checks out the ATTEMPT branch and runs this
#          repo's own build / test / lint / measure commands, writes a normalized
#          metrics.json { build_passes, test_pass_rate|null, lint_count|null,
#          bundle_size_bytes|null }, and uploads it with the attempt source under
#          code/. It never sees a credential and persist-credentials is false.
#   score  (BYTE-IDENTICAL across all five roster repos) checks out the DEFAULT
#          branch only, downloads build's artifact, overlays the attempt source,
#          pulls the holdout, runs it counting passes from node --test's TAP
#          reporter via scripts/improve-report.mjs (never an exit code), then reads
#          metrics.json, signs and posts.
#
# ONLY THE build JOB DIFFERS PER REPO. The score job and scripts/improve-report.mjs
# are copied verbatim; change them here and re-copy, never edit one copy.
#
# WHY THE SPLIT. The old single job ran attempt code beside the holdout suite and
# the signing key. Now the largest attacker-controlled execution (npm ci, build,
# the repo's own tests, lint) runs in build with no secrets, and score holds the
# secrets but runs trusted default-branch glue. The Worker also refuses, before it
# dispatches, any attempt touching a protected path, so nothing that could steer
# this file or the toolchain reaches a branch.
#
# RESIDUAL: the holdout tests import the attempt source, so attempt code still runs
# in the score job. Credentials are step-scoped away from it and pass counting is
# by trusted TAP parsing; full isolation would need a sandbox, not a workflow.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The attempt branch to score.
        required: true
      run_id:
        description: The improve run this attempt belongs to.
        required: true
      attempt_id:
        description: The attempt being scored. The literal suffix -baseline measures the base.
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (per-repo, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Capture the attempt head sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # AFTER checkout: actions/checkout cleans the workspace, so a file written
      # before it is deleted and never reaches the artifact.
      - name: Stamp the start
        id: started
        run: echo "epoch=$(date -u +%s)" > started.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- PER-REPO measurement. capsid-mcp: node --test, tsc, wrangler. ----
      - name: Build
        id: build
        continue-on-error: true
        run: npm run check

      # node directly, not `npm test --`: the reporter flags must come BEFORE the
      # test glob or node ignores them (npm would append them after the script's
      # fixed glob). PER-REPO command; mirrors package.json's test invocation.
      - name: Test
        id: test
        continue-on-error: true
        run: node --import ./test/resolve-ts.mjs --test-reporter=tap --test-reporter-destination=test-report.json --test "test/*.test.ts"

      - name: Measure
        id: measure
        continue-on-error: true
        run: |
          set -uo pipefail
          BUILD_PASSES=0; [ "${{ steps.build.outcome }}" = "success" ] && BUILD_PASSES=1
          RATE=$(node scripts/improve-report.mjs --rate test-report.json || echo "")
          LINT_COUNT=$(npm run check:test 2>&1 | grep -c "error TS" || true)
          BUNDLE_BYTES=$(npx wrangler deploy --dry-run --outdir=.improve-build > /dev/null 2>&1 && du -sb .improve-build 2>/dev/null | cut -f1 || echo "")
          BUILD_PASSES="${BUILD_PASSES}" RATE="${RATE}" LINT_COUNT="${LINT_COUNT}" BUNDLE_BYTES="${BUNDLE_BYTES}" node -e '
            const n=(v)=>(v===undefined||v===""?null:Number(v));
            process.stdout.write(JSON.stringify({
              build_passes: Number(process.env.BUILD_PASSES||"0"),
              test_pass_rate: n(process.env.RATE),
              lint_count: n(process.env.LINT_COUNT),
              bundle_size_bytes: n(process.env.BUNDLE_BYTES),
            }));
          ' > metrics.json
          cat metrics.json

      # PER-REPO: the source tree(s) the holdout imports. capsid-mcp: src.
      - name: Stage the scored source
        run: |
          set -euo pipefail
          mkdir -p code
          cp -r src code/

      - name: Upload the attempt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attempt
          retention-days: 1
          path: |
            metrics.json
            started.txt
            code

  # ============================================================================
  # BYTE-IDENTICAL BELOW THIS LINE ACROSS ALL FIVE ROSTER REPOS. Do not edit one
  # copy; edit capsid-mcp's and re-copy.
  # ============================================================================
  score:
    name: score (holds secrets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the attempt artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attempt
          path: attempt

      - name: Overlay the attempt source
        run: |
          set -euo pipefail
          if [ -d attempt/code ]; then
            for d in attempt/code/*; do
              [ -e "$d" ] || continue
              t="$(basename "$d")"
              rm -rf "./$t"
              cp -r "$d" "./$t"
            done
          fi

      # R2 holdout secrets are env ON THIS STEP ONLY; no attempt code runs here.
      - name: Pull the holdout suite
        id: holdout
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.IMPROVE_HOLDOUT_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.IMPROVE_HOLDOUT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.IMPROVE_HOLDOUT_R2_SECRET_ACCESS_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
        run: |
          set -euo pipefail
          mkdir -p .improve-holdout
          aws s3 sync \
            "s3://capsid-improve-holdout/improve/holdout/${IMPROVE_NAMESPACE}/" \
            .improve-holdout/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      # Count passes from the TAP reporter via the trusted script, never exit codes.
      - name: Run the holdout suite
        id: holdout_run
        continue-on-error: true
        run: |
          set -uo pipefail
          TOTAL=$(node -e 'try{process.stdout.write(String(require("./.improve-holdout/manifest.json").total))}catch{process.stdout.write("")}')
          LOADER=""
          [ -f ./test/resolve-ts.mjs ] && LOADER="--import ./test/resolve-ts.mjs"
          PASSED=0
          for f in .improve-holdout/*.test.*; do
            [ -e "$f" ] || continue
            REPORT=".improve-holdout/.report-$(node -e 'process.stdout.write(require("crypto").randomUUID())').json"
            # shellcheck disable=SC2086
            node --test --test-reporter=tap --test-reporter-destination="$REPORT" $LOADER "$f" > /dev/null 2>&1 || true
            if node scripts/improve-report.mjs --holdout "$REPORT"; then
              PASSED=$((PASSED+1))
            fi
          done
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"

      # RUN_ID, ATTEMPT_ID and the key are in THIS step's own env so a poisoned
      # GITHUB_ENV cannot override them; NODE_OPTIONS is cleared; the HMAC is
      # computed by node with the key read from the environment, never argv; curl is
      # absolute-pathed. ci_minutes is computed before the body.
      - name: Post the score report
        if: always()
        env:
          IMPROVE_SCORE_KEY: ${{ secrets.IMPROVE_SCORE_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
          CAPSID_URL: https://capsid.dustin-edwards.workers.dev
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ATTEMPT_HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          HOLDOUT_TOTAL: ${{ steps.holdout_run.outputs.total }}
          HOLDOUT_PASSED: ${{ steps.holdout_run.outputs.passed }}
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          if [ -z "${IMPROVE_SCORE_KEY}" ]; then
            echo "IMPROVE_SCORE_KEY is unset; the report cannot be signed and will not be sent." >&2
            exit 1
          fi
          STARTED_EPOCH=$(sed -n 's/^epoch=//p' attempt/started.txt 2>/dev/null || echo "")
          export CI_MINUTES=$(S="${STARTED_EPOCH}" N="$(date -u +%s)" node -e 'const s=Number(process.env.S||"0"),n=Number(process.env.N||"0");process.stdout.write(s>0?((n-s)/60).toFixed(2):"0")')
          BODY=$(node scripts/improve-report.mjs attempt/metrics.json "${HOLDOUT_TOTAL}" "${HOLDOUT_PASSED}")
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIG=$(TS="${TS}" BODY="${BODY}" node -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.IMPROVE_SCORE_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          echo "Posting score report for ${ATTEMPT_ID}:"
          echo "${BODY}"
          /usr/bin/curl --fail-with-body --silent --show-error \
            -X POST "${CAPSID_URL}/improve/score" \
            -H "Content-Type: application/json" \
            -H "X-Improve-Namespace: ${IMPROVE_NAMESPACE}" \
            -H "X-Improve-Timestamp: ${TS}" \
            -H "X-Improve-Signature: ${SIG}" \
            --data "${BODY}"
